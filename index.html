<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopIt Product Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .product-card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
      overflow: hidden;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;  
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-image {
      width: 100%;
      height: 270px;
      background: url('https://www.masterdynamic.com/cdn/shop/files/MW75S2-PDP_1350x1350_Hero_V2_c052fa00-f837-40f7-98aa-938d9cd09d0d.png?v=1734984989/300x200') center/cover no-repeat;
    }

    .product-info {
      padding: 16px;
      text-align: center;
    }

    .product-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .product-price {
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: bold;
      color: #F39C12;
      margin-bottom: 16px;
    }

    .add-to-cart {
      background-color: #F39C12;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    .add-to-cart:hover {
      background-color: #d9840f;
    }

    .add-to-cart:active {
      transform: scale(1.2)
    }
  </style>
</head>
<body>
  <div class="product-card">
    <div class="product-image"></div>
    <div class="product-info">
      <div class="product-title">Wireless Headphones</div>
      <div class="product-price">$59.99</div>
      <button class="add-to-cart">Add to Cart</button>
    </div>
  </div>
</body>
</html>
